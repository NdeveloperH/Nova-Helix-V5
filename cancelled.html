<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout cancelled — Nova Helix</title>
<style>
  :root{--bg:#0b0d16;--panel:#141829;--text:#e8eaf6;--muted:#9aa3c0;--accent:#7c5cff;--accent2:#4ea3ff;--line:#262d4a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:48px;text-align:center}
  h1{font-size:1.9rem;margin-bottom:8px}
  p{color:var(--muted);margin-top:14px}
  a{color:var(--accent2);text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <h1>No charge was made</h1>
    <p>You closed the checkout before finishing, so nothing was billed.</p>
    <p>Nova Helix Free keeps working exactly as it did — a full local companion, no account required. You can upgrade any time from <strong>Settings → Models</strong> in the app.</p>
    <p><a href="https://ndeveloperh.github.io/Nova-Helix-V5/">Back to Nova Helix</a></p>
  </div>
</body>
</html>
